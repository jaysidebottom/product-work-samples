<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc"><title id="title">Crucible · Treat instruction growth as a hypothesis</title><desc id="desc">Deletion candidates compete under the evaluation policy; shorter does not automatically mean better.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs><rect width="1000" height="740" fill="#f8fafc"/><path d="M40 40h36" stroke="#0f766e" stroke-width="4"/>
<text x="40" y="82" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#0f172a">Crucible · Treat instruction growth as a hypothesis</text>
<text x="40" y="114" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Deletion candidates compete under the evaluation policy; shorter does not automatically mean better.</text>
<rect x="40" y="155" width="280" height="170" rx="12" fill="white" stroke="#cbd5e1"/><rect x="40" y="171" width="3" height="24" fill="#0f766e"/>
<text x="58" y="181" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e">01  VALIDATE</text>
<text x="58" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Constrain each mutation</text>
<text x="58" y="238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Preserve headings and structure</text>
<text x="58" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Reject repeated four-word</text>
<text x="58" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">sequences</text>
<text x="58" y="310" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Cap extreme growth at 15×</text>
<rect x="360" y="155" width="280" height="170" rx="12" fill="white" stroke="#cbd5e1"/><rect x="360" y="171" width="3" height="24" fill="#0f766e"/>
<text x="378" y="181" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e">02  KNOCKOUT PRESSURE</text>
<text x="378" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Schedule subtraction</text>
<text x="378" y="238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">At least 30 mutable lines; then</text>
<text x="378" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">every fourth cycle or a recent</text>
<text x="378" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">concentration of additive operators</text>
<rect x="680" y="155" width="280" height="170" rx="12" fill="white" stroke="#cbd5e1"/><rect x="680" y="171" width="3" height="24" fill="#0f766e"/>
<text x="698" y="181" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e">03  EVALUATE</text>
<text x="698" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Select and test a section</text>
<text x="698" y="238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Rank large, weak-benefit sections</text>
<text x="698" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Test a deletion candidate</text>
<text x="698" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">May replace the crossover slot</text>
<path d="M320 240H356" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M640 240H676" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M820 325V370" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="375" width="920" height="125" rx="12" fill="white" stroke="#cbd5e1"/><rect x="40" y="391" width="3" height="24" fill="#0f766e"/>
<text x="58" y="410" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Record results, update history, and retain or promote</text>
<text x="58" y="438" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Section rank = line count × (1 − historical improvement rate).</text>
<text x="58" y="462" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Growth pressure counts additive operators, not a 20-line increase; historical size caps differed.</text>
<path d="M180 375V329" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="40" y="550" width="920" height="125" rx="10" fill="#eaf3f3"/>
<text x="58" y="578" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#115e59">Related concern, separate mechanism: memory context</text>
<text x="58" y="605" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Gemma’s OpenViking-inspired wrapper controls retrieved knowledge through scope and detail levels.</text>
<text x="58" y="628" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Later Crucible memory maintenance adds gated merging and stale flags; it does not compact SKILL.md.</text>
<text x="58" y="651" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">No measured prompt-cost savings or capability gains are established by these mechanisms.</text>
<text x="40" y="718" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#64748b">HISTORICAL IMPLEMENTATION  /  CONCEPTUAL SUMMARY  /  NO VALIDATED CAPABILITY GAIN</text>
</svg>