<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="735" viewBox="0 0 1000 735" role="img" aria-labelledby="title desc"><title id="title">Gemma · Memory scope and context depth</title><desc id="desc">Application policies wrap Hindsight storage and retrieval; banks and detail levels are separate.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs><rect width="1000" height="735" fill="#f8fafc"/><path d="M40 40h36" stroke="#0f766e" stroke-width="4"/>
<text x="40" y="82" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#0f172a">Gemma · Memory scope and context depth</text>
<text x="40" y="114" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Application policies wrap Hindsight storage and retrieval; banks and detail levels are separate.</text>
<rect x="40" y="155" width="280" height="175" rx="12" fill="white" stroke="#cbd5e1"/><rect x="40" y="171" width="3" height="24" fill="#0f766e"/>
<text x="58" y="181" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e">SCOPE</text>
<text x="58" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Choose whose knowledge</text>
<text x="58" y="238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">self → current agent bank</text>
<text x="58" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">team / all → shared bank</text>
<text x="58" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">agent name → selected bank</text>
<rect x="360" y="155" width="280" height="175" rx="12" fill="white" stroke="#cbd5e1"/><rect x="360" y="171" width="3" height="24" fill="#0f766e"/>
<text x="378" y="181" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e">RELEVANCE</text>
<text x="378" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Choose a retrieval path</text>
<text x="378" y="238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Regular: query expansion +</text>
<text x="378" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">merge</text>
<text x="378" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">or namespace-first retrieval</text>
<text x="378" y="310" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Fallback: regular recall</text>
<rect x="680" y="155" width="280" height="175" rx="12" fill="white" stroke="#cbd5e1"/><rect x="680" y="171" width="3" height="24" fill="#0f766e"/>
<text x="698" y="181" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e">DETAIL</text>
<text x="698" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Choose how much to load</text>
<text x="698" y="238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">L0 · abstract; brief relevance scan</text>
<text x="698" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">L1 · overview; additional context</text>
<text x="698" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">L2 · complete stored text</text>
<path d="M320 240H356" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M640 240H676" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M820 330V375" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="680" y="380" width="280" height="125" rx="12" fill="white" stroke="#cbd5e1"/><rect x="680" y="396" width="3" height="24" fill="#0f766e"/>
<text x="698" y="415" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Use context in a task</text>
<text x="698" y="443" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Role instructions + recalled text</text>
<text x="698" y="467" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Record retrieval traces</text>
<rect x="360" y="380" width="280" height="125" rx="12" fill="white" stroke="#cbd5e1"/><rect x="360" y="396" width="3" height="24" fill="#0f766e"/>
<text x="378" y="415" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Extract and retain</text>
<text x="378" y="443" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Learnings or episodic summary</text>
<text x="378" y="467" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Selective create / skip / merge</text>
<rect x="40" y="380" width="280" height="125" rx="12" fill="white" stroke="#cbd5e1"/><rect x="40" y="396" width="3" height="24" fill="#0f766e"/>
<text x="58" y="415" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Store through Hindsight</text>
<text x="58" y="443" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Full text, summaries, and tags</text>
<text x="58" y="467" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Update namespace abstract</text>
<path d="M680 440H644" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M360 440H324" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M180 380V334" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="40" y="550" width="920" height="125" rx="10" fill="#eaf3f3"/>
<text x="58" y="578" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#115e59">Context management is separate from prompt compaction</text>
<text x="58" y="605" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">OpenViking-inspired tiered loading and retrieval were adapted into the Hindsight wrapper.</text>
<text x="58" y="628" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Instruction-file growth uses mutation validation and deletion experiments, not this memory path.</text>
<text x="58" y="651" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Scope names do not prove access isolation; retained lessons and usage scores do not prove correctness.</text>
<text x="40" y="713" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#64748b">HISTORICAL IMPLEMENTATION  /  CONCEPTUAL SUMMARY  /  NO VALIDATED CAPABILITY GAIN</text>
</svg>