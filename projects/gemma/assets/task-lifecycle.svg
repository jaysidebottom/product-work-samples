<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">Gemma · A task through the agent team</title><desc id="desc">Execution, review, and persistent feedback have different responsibilities.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs><rect width="1000" height="760" fill="#f8fafc"/><path d="M40 40h36" stroke="#0f766e" stroke-width="4"/>
<text x="40" y="82" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#0f172a">Gemma · A task through the agent team</text>
<text x="40" y="114" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Execution, review, and persistent feedback have different responsibilities.</text>
<rect x="40" y="155" width="280" height="145" rx="12" fill="white" stroke="#cbd5e1"/><rect x="40" y="171" width="3" height="24" fill="#0f766e"/>
<text x="58" y="181" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e">01  COORDINATE</text>
<text x="58" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Direct</text>
<text x="58" y="238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Decompose the user task</text>
<text x="58" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Record assignments and</text>
<text x="58" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">dependencies</text>
<rect x="360" y="155" width="280" height="145" rx="12" fill="white" stroke="#cbd5e1"/><rect x="360" y="171" width="3" height="24" fill="#0f766e"/>
<text x="378" y="181" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e">02  ASSIGN</text>
<text x="378" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Route</text>
<text x="378" y="238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Match capability and heartbeat</text>
<text x="378" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Rank skill; account for active work</text>
<rect x="680" y="155" width="280" height="145" rx="12" fill="white" stroke="#cbd5e1"/><rect x="680" y="171" width="3" height="24" fill="#0f766e"/>
<text x="698" y="181" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e">03  WORK</text>
<text x="698" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Execute</text>
<text x="698" y="238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Load role instructions and memory</text>
<text x="698" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Run, reflect, revise, or report</text>
<text x="698" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">failure</text>
<path d="M320 225H356" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M640 225H676" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M820 300V345" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="680" y="350" width="280" height="145" rx="12" fill="white" stroke="#cbd5e1"/><rect x="680" y="366" width="3" height="24" fill="#0f766e"/>
<text x="698" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e">04  CHECK</text>
<text x="698" y="405" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Review</text>
<text x="698" y="433" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Director inspects result evidence</text>
<text x="698" y="457" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Coordinate follow-up or recovery</text>
<path d="M680 420H644" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360" y="350" width="280" height="145" rx="12" fill="white" stroke="#cbd5e1"/><rect x="360" y="366" width="3" height="24" fill="#0f766e"/>
<text x="378" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e">05  MEMORY</text>
<text x="378" y="405" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Retain</text>
<text x="378" y="433" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Extract lessons or task summaries</text>
<text x="378" y="457" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Recall context for later work</text>
<rect x="40" y="350" width="280" height="145" rx="12" fill="white" stroke="#cbd5e1"/><rect x="40" y="366" width="3" height="24" fill="#0f766e"/>
<text x="58" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e">06  EXPERIENCE</text>
<text x="58" y="405" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Progress</text>
<text x="58" y="433" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Record XP and skill activity</text>
<text x="58" y="457" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Guide routing and practice quests</text>
<path d="M680 475V525H180V499" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M500 350V336H780V304" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<path d="M180 350V315H460V304" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<path d="M960 420H980V135H180V151" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="40" y="565" width="920" height="125" rx="10" fill="#eaf3f3"/>
<text x="58" y="593" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#115e59">Four loops; four different effects</text>
<text x="58" y="620" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Review can revise the output. Memory changes future context. XP influences routing and practice.</text>
<text x="58" y="643" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Breeding changes instructions through a separate evaluation loop. Audit records make activity inspectable.</text>
<text x="58" y="666" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Solid arrows show work and records; dashed arrows show feedback. XP is not a mastery measure.</text>
<text x="40" y="738" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#64748b">HISTORICAL IMPLEMENTATION  /  CONCEPTUAL SUMMARY  /  NO VALIDATED CAPABILITY GAIN</text>
</svg>